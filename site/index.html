<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yukusue Sushi Antártico — Restaurante japonês em São Bernardo do Campo</title>
  <meta name="description" content="Restaurante japonês na Av. Antártico, 240, Jardim do Mar, São Bernardo do Campo. Refeição no local, retirada e entrega. Telefone (11) 4121-5552.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sections.css">
</head>
<body>
  <a class="skip" href="#conteudo">Pular para o conteúdo</a>

  <header class="s-header" id="topo">
    <nav class="s-header__nav wrap" aria-label="Principal">
      <ul class="s-header__links s-header__links--a" role="list">
        <li><a href="#pratos">Pratos</a></li>
        <li><a href="#bebidas">Bebidas</a></li>
        <li><a href="#avaliacoes">Avaliações</a></li>
        <li class="only-mobile"><a href="#onde">Onde estamos</a></li>
      </ul>
      <a class="s-header__logo" href="#inicio" aria-label="Yukusue Sushi Antártico — início">
        <!-- PENDÊNCIA-CLIENTE: logo em vetor/alta. Este é o arquivo real de 150px (imgi_2), exibido em tamanho nativo. -->
        <img src="assets/logo-yukusue-146.png" width="146" height="40" alt="Yukusue">
      </a>
      <ul class="s-header__links s-header__links--b" role="list">
        <li class="only-desktop"><a href="#onde">Onde estamos</a></li>
        <li><a class="s-header__tel" href="tel:+551141215552">(11) 4121-5552</a></li>
      </ul>
    </nav>
  </header>

  <main id="conteudo">
    <section class="s-hero" id="inicio" aria-labelledby="hero-titulo">
      <h1 class="s-hero__title" id="hero-titulo">
        <span class="s-hero__word" data-text="Yukusue">Yukusue</span>
        <span class="sr-only">Sushi Antártico — restaurante japonês em São Bernardo do Campo</span>
      </h1>
      <div class="s-hero__stage" aria-hidden="false">
        <div class="s-hero__ice" aria-hidden="true">
          <svg class="s-hero__shards" viewBox="0 0 1000 260" preserveAspectRatio="none" focusable="false">
            <path d="M40 70 L210 22 L330 58 L250 120 Z" />
            <path d="M620 30 L780 8 L900 64 L720 96 Z" />
            <path d="M380 150 L520 110 L600 170 L470 210 Z" />
            <path d="M820 150 L960 120 L990 200 L860 230 Z" />
            <path d="M90 170 L200 150 L240 230 L110 245 Z" />
          </svg>
        </div>
        <img class="s-hero__temaki" src="assets/hero-temaki-699.webp" width="699" height="898"
             alt="Temaki de salmão com cebolinha">
        <img class="s-hero__salmao" src="assets/hero-salmao-800.webp"
             srcset="assets/hero-salmao-800.webp 800w, assets/hero-salmao-1057.webp 1057w"
             sizes="(min-width: 48rem) 26vw, 44vw" width="800" height="691"
             alt="Sashimi de salmão arrumado em forma de rosa">
      </div>
    </section>

    <div class="flow">
      <section class="s-pratos" id="pratos" aria-labelledby="pratos-titulo"></section>
      <section class="s-bebidas" id="bebidas" aria-labelledby="bebidas-titulo"></section>
    </div>

    <section class="s-local" id="onde" aria-labelledby="onde-titulo"></section>
  </main>
</body>
</html>
