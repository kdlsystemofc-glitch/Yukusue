<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yukusue Sushi Antártico — Restaurante japonês em São Bernardo do Campo</title>
  <meta name="description" content="Restaurante japonês na Av. Antártico, 240, Jardim do Mar, São Bernardo do Campo. Refeição no local, retirada e entrega. Telefone (11) 4121-5552.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sections.css">
</head>
<body>
  <a class="skip" href="#conteudo">Pular para o conteúdo</a>

  <header class="s-header" id="topo">
    <nav class="s-header__nav wrap" aria-label="Principal">
      <ul class="s-header__links s-header__links--a" role="list">
        <li><a href="#pratos">Pratos</a></li>
        <li><a href="#bebidas">Bebidas</a></li>
        <li><a href="#avaliacoes">Avaliações</a></li>
        <li class="only-mobile"><a href="#onde">Onde estamos</a></li>
      </ul>
      <a class="s-header__logo" href="#inicio" aria-label="Yukusue Sushi Antártico — início">
        <!-- PENDÊNCIA-CLIENTE: logo em vetor/alta. Este é o arquivo real de 150px (imgi_2), exibido em tamanho nativo. -->
        <img src="assets/logo-yukusue-146.png" width="146" height="40" alt="Yukusue">
      </a>
      <ul class="s-header__links s-header__links--b" role="list">
        <li class="only-desktop"><a href="#onde">Onde estamos</a></li>
        <li><a class="s-header__tel" href="tel:+551141215552">(11) 4121-5552</a></li>
      </ul>
    </nav>
  </header>

  <main id="conteudo">
    <section class="s-hero" id="inicio" aria-labelledby="hero-titulo">
      <h1 class="s-hero__title" id="hero-titulo">
        <span class="s-hero__word" data-text="Yukusue">Yukusue</span>
        <span class="sr-only">Sushi Antártico — restaurante japonês em São Bernardo do Campo</span>
      </h1>
      <div class="s-hero__stage" aria-hidden="false">
        <div class="s-hero__ice" aria-hidden="true">
          <svg class="s-hero__shards" viewBox="0 0 1000 260" preserveAspectRatio="none" focusable="false">
            <path d="M40 70 L210 22 L330 58 L250 120 Z" />
            <path d="M620 30 L780 8 L900 64 L720 96 Z" />
            <path d="M380 150 L520 110 L600 170 L470 210 Z" />
            <path d="M820 150 L960 120 L990 200 L860 230 Z" />
            <path d="M90 170 L200 150 L240 230 L110 245 Z" />
          </svg>
        </div>
        <img class="s-hero__temaki" src="assets/hero-temaki-699.webp" width="699" height="898"
             alt="Temaki de salmão com cebolinha">
        <img class="s-hero__salmao" src="assets/hero-salmao-800.webp"
             srcset="assets/hero-salmao-800.webp 800w, assets/hero-salmao-1057.webp 1057w"
             sizes="(min-width: 48rem) 26vw, 44vw" width="800" height="691"
             alt="Sashimi de salmão arrumado em forma de rosa">
      </div>
    </section>

    <div class="flow">
      <!-- E3: fita de água contínua (03→04). Estática: sem transform/filter/opacity nela ou em ancestrais. -->
      <img class="flow__fita" src="svg/fita.svg" alt="" aria-hidden="true" width="1440" height="1304">

      <section class="s-pratos" id="pratos" aria-labelledby="pratos-titulo">
        <h2 class="sr-only" id="pratos-titulo">Pratos</h2>
        <img class="s-pratos__bambu" src="svg/bambu.svg" alt="" aria-hidden="true" width="460" height="680">
        <figure class="s-pratos__ceviche">
          <span class="s-pratos__frame"><img src="assets/prato-ceviche-800.webp"
               srcset="assets/prato-ceviche-800.webp 800w, assets/prato-ceviche-1320.webp 1320w"
               sizes="(min-width: 48rem) 40vw, 80vw" width="800" height="679" loading="lazy"
               alt="Ceviche de polvo com cebola roxa e ovas de peixe em tigela de cerâmica azul-cobalto"></span>
          <!-- Texto do próprio cliente (sobreposto na foto original imgi_45) -->
          <figcaption>Ceviches frescos e temperadinhos</figcaption>
        </figure>
        <figure class="s-pratos__sal">
          <img src="assets/prato-sashimi-sal-800.webp"
               srcset="assets/prato-sashimi-sal-800.webp 800w, assets/prato-sashimi-sal-1440.webp 1440w"
               sizes="(min-width: 48rem) 34vw, 70vw" width="800" height="1067" loading="lazy"
               alt="Salmão com ovas e raspas de limão sobre pedra de sal, ao lado de sashimi, pepino e flores, com fumaça de gelo seco">
          <!-- PENDÊNCIA-CLIENTE: nome oficial deste prato no cardápio -->
          <figcaption>Salmão na pedra de sal</figcaption>
        </figure>
      </section>
      <section class="s-bebidas" id="bebidas" aria-labelledby="bebidas-titulo">
        <h2 class="sr-only" id="bebidas-titulo">Bebidas e avaliações</h2>
        <div class="s-bebidas__drinks">
          <!-- PENDÊNCIA-CLIENTE: nomes/sabores oficiais dos drinks -->
          <img class="s-bebidas__verde" src="assets/drink-verde-616.webp" width="616" height="737" loading="lazy"
               alt="Drink verde com rodelas de limão e guarda-chuva de papel">
          <img class="s-bebidas__vermelho" src="assets/drink-vermelho-481.webp" width="481" height="665" loading="lazy"
               alt="Drink vermelho com morango e guarda-chuva de papel">
        </div>
        <div class="s-bebidas__reviews" id="avaliacoes">
          <!-- Nota e total conforme ficha do Google Maps no levantamento (CLIENTE.md). Atualizar antes de publicar. -->
          <p class="s-bebidas__nota">
            <strong>4,3</strong>
            <svg class="s-bebidas__estrela" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>
            <span>2.722 avaliações no Google</span>
          </p>
          <!-- PENDÊNCIA-CLIENTE: autorização para citar avaliações (trechos literais, nome abreviado) -->
          <figure class="s-bebidas__quote">
            <blockquote><p>Ambiente aconchegante, muito bem estruturado e tranquilo de conversar, a comida é extremamente saborosa e o atendimento é rápido.</p></blockquote>
            <figcaption>Alziria A. · avaliação no Google</figcaption>
          </figure>
          <figure class="s-bebidas__quote">
            <blockquote><p>Fomos prontamente recebidos. […] O espaço é bem iluminado, limpo e possui música ambiente confortável (nada exagerado).</p></blockquote>
            <figcaption>Víctor M. · avaliação no Google</figcaption>
          </figure>
        </div>
      </section>
    </div>

    <section class="s-local" id="onde" aria-labelledby="onde-titulo"></section>
  </main>
</body>
</html>
